# The Chengdu80 web app on k3s.
# PLATFORM_INTERNAL_KEY must match the same key set on the Convex deployment
# (via `bunx convex env set PLATFORM_INTERNAL_KEY ...`) — see scripts/setup-k3s.sh.
#
# hostAliases: VITE_CONVEX_URL is inlined into the browser bundle at build
# time (packages/env/src/web.ts), so the same hostname must also resolve from
# inside this pod for server-side Convex calls (apps/web/src/server/repository.ts).
# It resolves to the Traefik ingress ClusterIP here so both the browser (via
# the Ingress + /etc/hosts on the host) and this pod (via hostAliases) reach
# Convex through the same Ingress route — mirroring how a real public DNS
# hostname would work identically from both contexts in production.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: chengdu80
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      hostAliases:
        - ip: "$(TRAEFIK_CLUSTER_IP)"
          hostnames:
            - convex.chengdu80.local
            - convex-site.chengdu80.local
      containers:
        - name: web
          image: chengdu80-web:k3s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3098
          env:
            - name: CD80_DEMO_MODE
              value: "1"
            - name: PORT
              value: "3098"
            - name: VITE_CONVEX_URL
              value: http://convex.chengdu80.local
            - name: PLATFORM_INTERNAL_KEY
              valueFrom:
                secretKeyRef: { name: chengdu80-secrets, key: PLATFORM_INTERNAL_KEY }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: chengdu80
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 3098
